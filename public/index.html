<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaApp - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-box__logo">InstaApp</h1>
            <p class="auth-box__subtitle">Masuk untuk melihat foto dan video dari teman-temanmu</p>

            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Masukkan email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
            </form>

            <div class="auth-box__divider">ATAU</div>

            <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Memproses...';

            try {
                const res = await api.login(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );

                if (res.error) {
                    showAlert(res.error, 'error');
                } else {
                    showAlert('Login berhasil! Mengalihkan...', 'success');
                    setTimeout(() => window.location.href = 'feed.html', 800);
                }
            } catch (err) {
                showAlert('Terjadi kesalahan, coba lagi', 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Masuk';
        });
    </script>
</body>
</html>
